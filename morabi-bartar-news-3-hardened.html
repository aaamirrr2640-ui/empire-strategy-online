async function publishPlayer(id){const p=P(id),priceVal=Math.floor(+$(' #sellprice'.trim()).value);if(!p)return;if(!Number.isFinite(priceVal)||priceVal<1||priceVal>10000000)return toast('قیمت باید بین ۱ تا ۱۰٬۰۰۰٬۰۰۰ سکه باشد');if(!Array.isArray(p.s)||p.s.length<6||!Number.isFinite(ov(p))||!p.id)return toast('اطلاعات بازیکن معتبر نیست');await Net.init();if(!Net.connected)return toast('امکان انتشار آگهی نیست');const d=transferState();if(d.listings.some(x=>x.seller===S.acc&&x.player.id===id))return toast('این بازیکن از قبل آگهی شده');const lid='tr-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);S.myL=S.myL||{};S.myL[lid]={pid:p.id,price:priceVal};d.listings.unshift({id:lid,seller:S.acc,sellerClub:S.club.name,price:priceVal,player:JSON.parse(JSON.stringify(p)),created:Date.now()});Net.saveTransfers(d);cm();SUB.m='buy';save();render();toast('آگهی فروش منتشر شد')}
function openListing(id){const d=transferState(),x=d.listings.find(q=>q.id===id);if(!x)return;const offers=d.offers.filter(o=>o.listingId===id);om(`<div class="row"><b>${x.player.n}</b><button class="btn o s" onclick="cm()">✕</button></div>${pcard(x.player,'')}<p class="mu">باشگاه: ${x.sellerClub} • فروشنده: ${x.seller}</p><div class="card"><div class="hd">قیمت فروشنده</div><div class="sb"><b class="n">${fa(x.price)}</b><span>🪙 سکه</span></div><button class="btn y w" onclick="buyListing('${x.id}')" ${x.seller===S.acc?'disabled':''}>خرید فوری</button></div>${x.seller===S.acc?`<div class="card"><div class="hd">پیشنهادهای رسیده (${fa(offers.length)})</div>${offers.map(o=>`<div class="pl"><div style="flex:1"><b>${o.buyerClub}</b><div class="mu">${o.buyer} • ${fa(o.price)} سکه</div></div><button class="btn y s" onclick="acceptOffer('${o.id}')">تأیید</button><button class="btn o s" onclick="rejectOffer('${o.id}')">رد</button></div>`).join('')||'<p class="mu">هنوز پیشنهادی نیست.</p>'}</div>`:`<div class="card"><div class="hd">ارسال پیشنهاد</div><input class="in" id="offerprice" type="number" min="1" step="100" value="${Math.max(1,Math.round(x.price*.9))}"><button class="btn w" onclick="sendOffer('${x.id}')">ارسال پیشنهاد به فروشنده</button></div>`}`)}
async function buyListing(id){await Net.init();if(!Net.connected)return toast('امکان انجام خرید نیست');const d=transferState(),x=d.listings.find(q=>q.id===id);if(!x)return toast('آگهی دیگر موجود نیست');if(x.seller===S.acc)return toast('نمی‌توانید بازیکن خودتان را بخرید');if(!Number.isFinite(Number(x.price))||x.price<1||x.price>10000000||!x.player||!x.player.id||!Array.isArray(x.player.s)||!Number.isFinite(ov(x)))return toast('اطلاعات آگهی معتبر نیست');if(S.coins<x.price)return toast('سکه کافی نیست');if(S.players.length>=30)return toast('سقف ۳۰ بازیکن');S.intents=S.intents||{};S.intents[x.id]={k:'buy',price:Number(x.price),ph:plHash(x.player)};completeDeal(x,S.acc,S.club.name,x.price,'buy')}
async function sendOffer(id){await Net.init();if(!Net.connected)return toast('امکان ارسال پیشنهاد نیست');const d=transferState(),x=d.listings.find(q=>q.id===id),v=Math.floor(+$(' #offerprice'.trim()).value);if(!x)return toast('آگهی دیگر موجود نیست');if(x.seller===S.acc)return toast('نمی‌توانید به خودتان پیشنهاد بدهید');if(!Number.isFinite(v)||v<1||v>10000000)return toast('قیمت باید بین ۱ تا ۱۰٬۰۰۰٬۰۰۰ سکه باشد');if(!x.player||!x.player.id||!Array.isArray(x.player.s)||!Number.isFinite(ov(x))||!Number.isFinite(Number(x.price))||x.price<1||x.price>10000000)return toast('اطلاعات آگهی معتبر نیست');if(S.coins<v)return toast('برای این پیشنهاد سکه کافی ندارید');const o={id:'of-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),listingId:id,buyer:S.acc,buyerClub:S.club.name,price:v,created:Date.now()};d.offers=d.offers.filter(q=>!(q.listingId===id&&q.buyer===S.acc));d.offers.unshift(o);S.intents=S.intents||{};S.intents[id]={k:'offer',oid:o.id,price:v,ph:plHash(x.player)};save();Net.saveTransfers(d);cm();render();toast('پیشنهاد برای فروشنده ارسال شد')}
async function acceptOffer(oid){await Net.init();if(!Net.connected)return toast('امکان تأیید پیشنهاد نیست');const d=transferState(),o=d.offers.find(q=>q.id===oid),x=o&&d.listings.find(q=>q.id===o.listingId);if(!o||!x)return toast('پیشنهاد منقضی شده');if(x.seller!==S.acc)return toast('فقط فروشنده می‌تواند تأیید کند');S.okOffers=S.okOffers||{};S.okOffers[o.id]={lid:x.id,price:Number(o.price),buyer:o.buyer};completeDeal(x,o.buyer,o.buyerClub,o.price,'offer',o.id)}
async function rejectOffer(oid){const d=transferState();d.offers=d.offers.filter(o=>o.id!==oid);Net.saveTransfers(d);cm();render();toast('پیشنهاد رد شد')}
function completeDeal(x,buyer,buyerClub,priceVal,kind,offerId=''){const d=transferState();if(!x||!d.listings.some(q=>q.id===x.id))return toast('این آگهی قبلاً معامله شده');if(!Number.isFinite(Number(priceVal))||Number(priceVal)<1||Number(priceVal)>10000000||!x.player||!x.player.id||!Array.isArray(x.player.s)||!Number.isFinite(ov(x))||typeof x.seller!=='string'||typeof buyer!=='string'||x.seller===buyer)return toast('اطلاعات معامله معتبر نیست');priceVal=Number(priceVal);const deal={id:'deal-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),listingId:x.id,seller:x.seller,buyer,buyerClub,price:priceVal,player:x.player,kind,offerId,created:Date.now()};d.listings=d.listings.filter(q=>q.id!==x.id);d.offers=d.offers.filter(o=>o.listingId!==x.id);Net.saveTransfers(d);Net.pub('deals/'+x.seller,deal);Net.pub('deals/'+buyer,deal);applyOnlineDeal(deal);cm();render();toast('معامله ثبت شد؛ انتقال در حساب دو طرف اعمال می‌شود')}
function applyOnlineDeal(deal){if(!S||S.setup||!deal||typeof deal.id!=='string'||deal.id.length>120||typeof deal.seller!=='string'||typeof deal.buyer!=='string'||deal.seller===deal.buyer||!deal.player||typeof deal.player!=='object'||!deal.player.id||typeof deal.player.n!=='string'||!Array.isArray(deal.player.s)||deal.player.s.length<6||!Number.isFinite(ov(deal.player))||!Number.isFinite(Number(deal.price))||Number(deal.price)<1||Number(deal.price)>10000000||!Number.isFinite(Number(deal.created)))return;deal.price=Number(deal.price);S.dealIds=S.dealIds||[];if(S.dealIds.includes(deal.id))return;let changed=false;if(S.acc===deal.seller){const ix=S.players.findIndex(p=>String(p.id)===String(deal.player.id));if(ix>=0&&sellOk(deal,S.players[ix])){delete S.myL[deal.listingId];S.players.splice(ix,1);S.coins=Math.min(1e9,Math.max(0,Number(S.coins)||0)+deal.price);fixLineup();changed=true}}if(S.acc===deal.buyer&&buyOk(deal)){if(S.coins<deal.price){addIn({ty:'info',txt:`⚠️ معامله ${deal.player.n} ثبت شد اما سکه کافی برای پرداخت ندارید.`})}else if(S.players.length<30){delete S.intents[deal.listingId];S.coins-=deal.price;const p=JSON.parse(JSON.stringify(deal.player));p.id=S.uid++;p.ce=Date.now()+30*DAY;p.exp=0;p.mor=75;S.players.push(p);changed=true}}S.dealIds.push(deal.id);S.dealIds=S.dealIds.slice(-100);if(changed){save();if(S.acc===deal.buyer)addIn({ty:'info',txt:`✅ ${deal.player.n} از ${deal.seller} خریداری شد.`});if(S.acc===deal.seller)addIn({ty:'info',txt:`💰 ${deal.player.n} فروخته شد؛ ${fa(deal.price)} سکه دریافت کردید.`});render()}}
function refresh(){S.market=(Array.isArray(S.market)?S.market:[]).filter(p=>p&&p.id&&Array.isArray(p.s)&&p.s.length>=6&&Number.isFinite(ov(p))).slice(0,15)}

// ===== تمرین =====
const tmax=()=>3+cl((S&&S.hall)|0,0,10);
const tdy=()=>{const k=new Date().toISOString().slice(0,10);if(!S.td||S.td.k!=k)S.td={k,ids:[],ps:[]};if(!S.td.ps)S.td.ps=[];return S.td};
function train(id,k){const p=P(id),T=tdy();if(p.inj)return toast('مصدوم است');T.ps=T.ps||[];if(T.ps.includes(id+':'+k))return toast('این مهارت امروز تمرین شده؛ مهارت دیگری را انتخاب کن');if(T.ids.length>=tmax())return toast('سهمیه تمرین امروز تمام شده؛ فردا دوباره یا سالن تمرین را ارتقا بده');if(ov(p)>=p.pot||p.s[k]>=99)return toast('به سقف پتانسیل رسیده');if(S.coins<trainCost(p))return toast('سکه کافی نیست');
S.coins-=trainCost(p);T.ids.push(id);T.ps.push(id+':'+k);const g=R(1,2)+(Math.random()<S.fac.coach*.08?1:0),b=p.s[k];p.s[k]=Math.min(99,b+g);S.xp+=10;save();render();openP(id);toast(`${PN[k]} ${p.n}: ${fa(b)} ← ${fa(p.s[k])}`)}
function refill(id){if(S.gems<5)return toast('جم کافی نیست');S.gems-=5;P(id).en=100;save();render();openP(id)}
function upFac(k){const lv=S.fac[k],c=2000*(lv+1)**2;if(lv>=5)return;if(S.coins<c)return toast('سکه کافی نیست');S.coins-=c;S.fac[k]++;S.xp+=40;save();render()}
function youth(){if(Date.now()-S.yt<864e5)return toast('جوان امروز گرفته شده');if(S.players.length>=30)return toast('سقف ۳۰ بازیکن');S.yt=Date.now();const p=gen(PO[R(0,3)],-8+S.fac.acad*3,R(16,18),6+S.fac.acad*3);p.n='⭐ '+p.n;p.ce=Date.now()+30*DAY;S.players.push(p);save();render();om(`<div style="text-align:center"><div class="hd" style="justify-content:center">🎓 جوان آکادمی</div><div style="max-width:190px;margin:auto">${pcard(p,'')}</div><br><button class="btn w" onclick="cm()">عالی</button></div>`)}
function daily(){if(Date.now()-S.dl<864e5)return toast('جایزه امروز گرفته شده');S.dl=Date.now();S.coins+=1000;S.gems+=5;save();render();toast('۱۰۰۰ سکه + ۵ جم')}

// ===== قرارداد: خرید = ۱ ماه، هر تمدید = ۱ هفته، پایان قرارداد = ۲۴ ساعت مهلت (تمدید / فروش / رها کردن) =====
const ctCost=p=>Math.round(wage(p)*10*(1+Math.max(0,ov(p)-55)/25)/10)*10;
const trainCost=p=>Math.round(TCOST*Math.pow(ov(p)/55,2)/10)*10;
const ctLeft=p=>(p.ce||0)-Date.now();
function ctTxt(p){if(p.exp)return'⛔ قرارداد تمام شده';const ms=Math.max(0,ctLeft(p)),d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5);return d>0?fa(d)+' روز و '+fa(h)+' ساعت':fa(h)+' ساعت'}
function extend(p){p.ce=Math.max(p.ce||0,Date.now())+7*DAY;p.exp=0;p.mor=cl(p.mor+10,0,100);S.inbox.forEach(x=>{if(!x.done&&x.opts&&x.opts.some(o=>o.e&&o.e.renew==p.id)){x.done=1;x.pick='تمدید شد'}})}
function fillSquad(){let n=0;while(S.players.length<14||S.players.filter(p=>p.pos=='GK').length<2){const ps=S.players.filter(p=>p.pos=='GK').length<2?'GK':pk(PO),q=gen(ps,-8,R(18,25));S.players.push(q);n++}return n}
function sellP(id,price){const p=P(id);if(!p)return;S.players=S.players.filter(x=>x!==p);S.coins+=price;addIn({ty:'info',txt:`💰 ${p.n} فروخته شد؛ ${fa(price)} سکه دریافت کردید.`});fillSquad();fixLineup()}
function releaseP(id){const p=P(id);if(!p)return;S.players=S.players.filter(x=>x!==p);addIn({ty:'info',txt:`👋 ${p.n} از تیم رفت.`});fillSquad();fixLineup()}
function contractCheck(){if(!S||S.setup||S.fired)return;const now=Date.now();let ch=0;
 S.players.slice().forEach(p=>{if(!p.ce){p.ce=now+30*DAY;ch=1;return}
  if(!p.exp&&p.ce<=now){p.exp=now;ch=1;const c=ctCost(p),sp=Math.round(price(p)*.8);addIn({ty:'contract',o:1,txt:`📝 قرارداد ${p.n} تمام شد. تا ۲۴ ساعت فرصت دارید: تمدید (۱ هفته)، فروش یا رها کردن؛ وگرنه می‌رود.`,opts:[{l:'تمدید ۱ هفته 🪙 '+fa(c),e:{renew:p.id,cost:c}},{l:'فروش 🪙 '+fa(sp),e:{sell:{id:p.id,price:sp}}},{l:'رها کردن',e:{release:p.id}}]})}
  else if(p.exp&&now-p.exp>DAY){ch=1;S.inbox.forEach(x=>{if(!x.done&&x.opts&&x.opts.some(o=>o.e&&(o.e.renew==p.id||o.e.release==p.id))){x.done=1;x.pick='رفت'}});S.players=S.players.filter(x=>x!==p);addIn({ty:'info',txt:`👋 قرارداد ${p.n} تمدید نشد و او تیم را ترک کرد.`})}});
 if(ch){fillSquad();fixLineup();save();if($('#m').style.display!='flex')render()}}
function renewP(id){const p=P(id),c=ctCost(p);if(S.coins<c)return toast('سکه کافی نیست');S.coins-=c;extend(p);save();render();openP(id);toast('قرارداد ۱ هفته تمدید شد')}

// ===== رابط =====
function toast(t){const e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
const cm=()=>{clearInterval(LT);$('#m').style.display='none'},om=h=>{$('#mb').innerHTML=h;$('#m').style.display='flex'};
function save(){if(!S)return;S.t=Date.now();try{localStorage.setItem(Net.key(S.acc),JSON.stringify(S))}catch(e){}}
let cid=0;
function crest(c,s=40){const id='c'+(cid++),d=c.shape==2?'M20 1.5l16 8.5v19.5L20 43.5 4 29.5V10z':'M20 1.5l17 6v14c0 11.5-7.5 19-17 22C10.5 40.5 3 33 3 21.5v-14z',sh=x=>c.shape==1?`<circle cx="20" cy="22" r="18.5" ${x}/>`:`<path d="${d}" ${x}/>`;
return`<svg width="${s}" height="${s*1.1}" viewBox="0 0 40 45"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.c1}"/><stop offset="1" stop-color="${c.c1}" stop-opacity=".62"/></linearGradient><clipPath id="${id}c">${sh('')}</clipPath></defs>${sh(`fill="#0b1022" stroke="${c.c2}" stroke-width="2.4"`)}<g clip-path="url(#${id}c)"><rect width="40" height="45" fill="url(#${id})"/><rect width="40" height="10" fill="${c.c2}" opacity=".16"/><path d="M0 33Q20 27 40 33V45H0z" fill="#000" opacity=".22"/></g>${sh(`fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8" transform="translate(20 22) scale(.88) translate(-20 -22)"`)}<g transform="translate(0,-1)">${emb(c.icon||0,c.c2,'#0007')}</g></svg>`}
function jersey(c,s=48){const id='j'+(jid++),B='M12 6L4 12l4 8 4-2v22h16V18l4 2 4-8-8-6Q20 11 12 6z',k=c.kit||0;
return`<svg width="${s}" height="${s*1.1}" viewBox="0 0 40 44"><defs><clipPath id="${id}"><path d="${B}"/></clipPath></defs><path d="${B}" fill="${c.c1}"/><g clip-path="url(#${id})" fill="${c.c2}">${k==1?'<rect x="14" width="4" height="44"/><rect x="22" width="4" height="44"/>':k==2?'<rect x="20" width="20" height="44"/>':k==3?'<rect y="16" width="40" height="5"/><rect y="27" width="40" height="5"/>':''}</g><g clip-path="url(#${id})"><rect y="30" width="40" height="14" fill="#000" opacity=".16"/><path d="M4 12l4 8 4-2V6z" fill="#000" opacity=".12"/><path d="M36 12l-4 8-4-2V6z" fill="#000" opacity=".12"/></g><path d="${B}" fill="none" stroke="#ffffff99" stroke-width=".8"/><path d="M15 6.4Q20 12 25 6.4" fill="none" stroke="${k?c.c1:c.c2}" stroke-width="1.6"/></svg>`}
const av=(p,s=44)=>{const c=S.club.c1?S.club:COLS[0].reduce((a,b)=>({c1:a,c2:b}));return`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M3 40c0-11 7-15 17-15s17 4 17 15z" fill="${c.c1}"/><path d="M15 25l5 5 5-5z" fill="${c.c2}"/><rect x="17" y="19" width="6" height="7" fill="#c99872"/><circle cx="20" cy="15" r="8" fill="${['#f1c9a5','#d9a47c','#b97b52'][p.id%3]}"/><path d="M12 13c0-8 16-8 16 0-2-3-5-4-8-4s-6 1-8 4z" fill="#2a1d14"/></svg>`};
function stadArt(lv,C){C=C||S.club;let r='';for(let i=lv;i>=0;i--)r+=`<ellipse cx="150" cy="74" rx="${90+i*8}" ry="${34+i*5}" fill="${i%2?C.c1:'#0007'}" stroke="${C.c2}" stroke-opacity="${.3+.1*i}" stroke-width="3"/>`;
return`<svg viewBox="0 0 300 140" style="width:100%;display:block">${r}<ellipse cx="150" cy="74" rx="80" ry="30" fill="#1a9449"/><ellipse cx="150" cy="74" rx="80" ry="30" fill="none" stroke="#fff7"/><line x1="150" y1="44" x2="150" y2="104" stroke="#fff7"/><circle cx="150" cy="74" r="9" fill="none" stroke="#fff7"/>${[28,272].map(x=>`<line x1="${x}" y1="22" x2="${x}" y2="64" stroke="#ffffff88" stroke-width="2"/><circle cx="${x}" cy="20" r="5" fill="#ffe9a0"/>`).join('')}</svg>`}
function radar(s,lb=PN,sz=260){const c=sz/2,r=sz/2-42,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI/3;return[c+Math.cos(a)*r*v/100,c+Math.sin(a)*r*v/100]};
let g=[25,50,75,100].map(l=>`<polygon points="${lb.map((_,i)=>pt(i,l)).join(' ')}" fill="${l==100?'#ffffff08':'none'}" stroke="#ffffff22"/>`).join('');
g+=lb.map((n,i)=>{const[x,y]=pt(i,100),[lx,ly]=pt(i,130);return`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#ffffff1c"/><text x="${lx}" y="${ly}" fill="#c3cbef" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Vazirmatn">${n} ${fa(s[i])}</text>`}).join('');
return`<svg viewBox="0 0 ${sz} ${sz}" style="width:100%;max-width:${sz+60}px;display:block;margin:auto"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--k1)"/><stop offset="1" stop-color="#8a6bff"/></linearGradient></defs>${g}<polygon points="${s.map((v,i)=>pt(i,cl(v,0,100))).join(' ')}" fill="url(#rg)" fill-opacity=".38" stroke="url(#rg)" stroke-width="2.5"/>${s.map((v,i)=>{const[x,y]=pt(i,cl(v,0,100));return`<circle cx="${x}" cy="${y}" r="3.5" fill="#fff"/>`}).join('')}</svg>`}
const st=p=>(p.inj?'🤕':'')+(p.exp?'⛔':'');

function admList(){const q=Net.normName(($('#adq')||{}).value||''),L=admUsers().filter(x=>!q||Net.normName(x.u+' '+(x.club||'')).includes(q));
 return L.length?L.map(x=>`<div class="pl"><div style="flex:1;min-width:0"><b>${admEsc(x.club||x.u)}</b><div class="mu">${admEsc(x.u)}${x.sc!=null?' • امتیاز '+fa(x.sc):''}</div></div><button class="btn y s" onclick="admGift(decodeURIComponent('${encodeURIComponent(x.u)}'))">🎁 هدیه</button></div>`).join(''):'<p class="mu">مربی‌ای پیدا نشد. (فهرست با اتصال به سرور کامل می‌شود)</p>'}
function adminV(){return`<div class="card hero"><div class="row"><div class="hd" style="margin:0">🛠️ پنل مدیریت</div><button class="btn r s" onclick="admOut()">خروج</button></div><p class="mu">این حساب در رتبه‌بندی و لیگ نیست. با «هدیه» سکه یا جم برای مربی ارسال کن؛ اگر آنلاین نباشد، با ورودش اعمال می‌شود.</p><input class="in" id="adq" placeholder="جستجوی نام..." oninput="$('#adl').innerHTML=admList()"></div><div class="card"><div class="hd">📰 انتشار خبر</div><input class="in" id="nwt" maxlength="80" placeholder="عنوان خبر"><textarea class="in" id="nwb" rows="4" maxlength="1500" placeholder="متن پیام..." style="resize:vertical"></textarea><button class="btn y w" onclick="admNewsPost()">📢 انتشار برای همه</button><div class="hd" style="margin:18px 0 10px">اخبار منتشرشده</div><div id="adn">${admNewsList()}</div></div><div class="card"><div class="hd">👥 مربیان</div><div id="adl">${admList()}</div></div>`}
function admGift(u){ADM_T=u;GK='coins';om(`<div class="row"><b>🎁 هدیه به ${admEsc(u)}</b><button class="btn o s" onclick="cm()">✕</button></div><div class="grid"><button class="btn" id="gk1" onclick="admKind('coins')">🪙 سکه</button><button class="btn o" id="gk2" onclick="admKind('gems')">💎 جم</button></div><input class="in" id="gam" type="number" min="1" inputmode="numeric" placeholder="مقدار"><input class="in" id="gms" maxlength="60" placeholder="پیام (اختیاری)"><button class="btn y w" onclick="admSend()">ارسال هدیه</button>`)}
function admKind(k){GK=k;$('#gk1').className='btn'+(k=='coins'?'':' o');$('#gk2').className='btn'+(k=='gems'?'':' o')}
async function admSend(){const amt=Math.floor(+$('#gam').value),msg=admEsc($('#gms').value).slice(0,60),to=ADM_T,kind=GK;if(!(amt>=1&&amt<=1e8))return toast('مقدار معتبر وارد کنید (۱ تا ۱۰۰ میلیون)');
 await Net.init();if(!Net.connected)return toast('اتصال به سرور برقرار نیست');
 const g={id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),to,kind,amt,msg,ts:Date.now()},topic=Net.root+'/admin/gift/'+encodeURIComponent(to)+'/'+g.id;try{await admSign('gift',g)}catch(e){return toast('کلید مدیریت بارگذاری نشده')}let sent=0;
 Net.cl.forEach(st=>{if(st&&st.ok)try{st.c.publish(topic,JSON.stringify(g),{qos:1,retain:true},e=>{if(!e)sent++})}catch(e){}});
 await new Promise(r=>setTimeout(r,600));if(!sent)return toast('ارسال نشد؛ دوباره تلاش کن');cm();toast('✅ '+fa(amt)+(kind=='coins'?' سکه':' جم')+' برای '+to+' ارسال شد')}
function applyGift(d){if(!S||!d||d.to!==S.acc||typeof d.id!='string'||d.id.length>40)return;S.gifts=S.gifts||[];if(S.gifts.includes(d.id))return;const a=Math.floor(+d.amt);if(!(a>=1&&a<=1e8)||(d.kind!='coins'&&d.kind!='gems'))return;
 S.gifts.push(d.id);S.gifts=S.gifts.slice(-300);if(d.kind=='coins')S.coins+=a;else S.gems+=a;addIn({ty:'info',txt:`🎁 هدیه از مدیریت: ${fa(a)} ${d.kind=='coins'?'سکه':'جم'}${d.msg?' — '+d.msg:''}`});save();toast('🎁 هدیه‌ی مدیریت دریافت شد');render()}
setInterval(()=>{if(ADM&&$('#adl')&&document.activeElement!==$('#adq'))$('#adl').innerHTML=admList()},4000);
boot();
setInterval(()=>{if(!S||S.setup)return;cd();tickMD()},1000);
setInterval(()=>{if(!S||S.setup)return;syncLg();pushSnap();contractCheck();lgRankSync();rkWatch();pubRank()},5000);
setInterval(()=>{if(!S||S.setup||S.fired)return;S.players.forEach(p=>p.en=Math.min(100,p.en+1+S.fac.doc));save();if($('#m').style.display!='flex'&&'lxo'.includes(tab))render()},30000);
addEventListener('online',()=>Net.kick());document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&S&&!S.setup){Net.kick();syncLg();tickMD()}});addEventListener('pagehide',()=>{try{save();Net.drain()}catch(e){}});
</script></body></html>
